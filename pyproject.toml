[project]
name = "multi-llm-chatbot"
version = "0.1.0"
description = "Multi-provider streaming AI playground & arena supporting Groq, NVIDIA NIM, DeepSeek, Qwen, xAI Grok, OpenRouter, Mistral, Gemini, and Ollama."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "groq>=0.11.0",
    "python-dotenv>=1.0.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
